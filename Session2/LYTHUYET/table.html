<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <table border="1" cellpadding="5" cellspacing="5">
        <!-- cellspacing="10" là khoảng cách giữa viền của ô đến viền của bảng -->
        <!-- cellpadding="10" là khoảng cách giữa nội dung và viền bảng -->
        <caption>Bảng danh sách sinh viên</caption>
        <!-- caption: tiêu đề bảng -->
        <thead>
            <!-- phần đầu bảng -->
            <tr>
                <!-- hàng -->
                <th>STT</th>
                <th>Tên</th>
                <!-- th: bôi đậm + căn giữa -->
            </tr>
        </thead>
        <tbody>
            <tr>
                <td align="center">1</td>
                <td align="center" bgcolor="blue">Phạm Thị Na Na</td>
                <!-- align="center": căn giữa -->
                <!-- bgcolor="blue": màu nền -->
            </tr>
            <!-- phần thân bảng -->
        </tbody>
        <tfoot>
            <!-- phần chân bảng -->
            <td colspan="2">Tổng số sinh viên: 1</td>
        </tfoot>
    </table>
</body>

</html>
